<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Survey{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f5bd3; --accent-text: #ffffff; --ok: #1f7a4d; --warn: #a86400; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1e1e1c; --text: #ececea; --muted: #a3a39d; --line: #33332f;
      --accent: #7b9cff; --accent-text: #0d0d0c; --ok: #5cc28d; --warn: #e0a13a; --bad: #f2867e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  a { color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 0 0 8px; line-height: 1.25; }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin: 12px 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
           border: 1px solid currentColor; }
  .s-draft { color: var(--muted); } .s-changes_requested { color: var(--warn); }
  .s-approved { color: var(--ok); } .s-closed { color: var(--bad); }
  .v-pending { color: var(--muted); } .v-ok { color: var(--ok); } .v-flag { color: var(--warn); } .v-fail { color: var(--bad); }
  .q { margin: 0 0 24px; } .q:last-child { margin-bottom: 0; }
  .q-prompt { font-weight: 600; margin-bottom: 4px; }
  .q-help { margin-bottom: 8px; }
  .q-error { color: var(--bad); font-size: 0.875rem; margin-top: 6px; }
  .q-meta { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  label.opt input { margin-top: 4px; }
  .scale { display: flex; gap: 6px; flex-wrap: wrap; }
  .scale label { flex: 1 0 40px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; cursor: pointer; }
  .scale input { display: block; margin: 0 auto 4px; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  input[type=text], input[type=number], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
       border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  fieldset[disabled] { opacity: 0.85; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
